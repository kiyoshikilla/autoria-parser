services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5430:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/migrations:/docker-entrypoint-initdb.d  # для автоматичних міграцій при першому запуску

  app:
    build: .
    command: python -m src.main
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    volumes:
      - .:/app
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
